<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nivel Digital Pro</title>
    <!-- Tailwind CSS para los estilos de la interfaz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Evitar scroll y rebote en celulares */
            overflow: hidden;
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
            background-color: #000000; /* Fondo negro base */
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* Efecto de pulso para llamar la atención del usuario */
        @keyframes pulse-btn {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(234, 179, 8, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(234, 179, 8, 0.8); }
        }
        .btn-massive {
            animation: pulse-btn 2s infinite;
        }
    </style>
</head>
<body>

    <!-- OVERLAY DE INICIO (z-index altísimo para que SIEMPRE esté arriba) -->
    <!-- Centrado perfecto usando flexbox para garantizar que se vea en cualquier pantalla -->
    <div id="overlay" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-black px-6">
        
        <div class="text-center w-full max-w-md">
            <!-- Icono de advertencia -->
            <div class="w-24 h-24 mx-auto bg-yellow-500/20 rounded-full flex items-center justify-center mb-6">
                <svg class="w-12 h-12 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
            </div>
            
            <h1 class="text-4xl font-black text-white mb-4 uppercase tracking-wider">Permisos</h1>
            <p class="text-gray-300 text-lg mb-10 font-medium">Activa los sensores de tu teléfono para usar el nivelador.</p>
            
            <!-- Botón amarillo masivo y de alto contraste -->
            <button id="startBtn" class="btn-massive w-full bg-yellow-400 hover:bg-yellow-300 text-black font-black text-4xl py-10 px-4 rounded-3xl transition-colors uppercase tracking-widest border-4 border-yellow-200">
                INICIAR NIVEL
            </button>
        </div>
        
    </div>

    <!-- LIENZO DEL NIVEL (Canvas) -->
    <canvas id="canvas"></canvas>

    <script>
        // Lógica principal de la aplicación
        window.onload = function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const overlay = document.getElementById('overlay');
            const startBtn = document.getElementById('startBtn');

            let width, height, cx, cy, maxDim;
            let targetBeta = 0;
            let targetGamma = 0;
            let smoothBeta = 0;
            let smoothGamma = 0;

            // Colores del nivel
            const COLOR_BG = '#000000'; // Fondo Negro
            const COLOR_LEVEL = '#22c55e'; // Verde Brillante
            const COLOR_LIQUID = '#0ea5e9'; // Azul Líquido

            // Ajuste de tamaño de pantalla
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * window.devicePixelRatio;
                canvas.height = height * window.devicePixelRatio;
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                cx = width / 2;
                cy = height / 2;
                maxDim = Math.max(width, height);
            }
            window.addEventListener('resize', resize);
            resize(); // Llamada inicial

            // Capturar datos del sensor
            function handleOrientation(event) {
                targetBeta = event.beta || 0; 
                targetGamma = event.gamma || 0;
                
                let orientation = window.orientation || 0;
                if (orientation === 90) {
                    let temp = targetBeta;
                    targetBeta = -targetGamma;
                    targetGamma = temp;
                } else if (orientation === -90) {
                    let temp = targetBeta;
                    targetBeta = targetGamma;
                    targetGamma = -temp;
                }
            }

            // Iniciar sensores al hacer clic en el botón masivo
            startBtn.addEventListener('click', () => {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    // iPhone / iOS 13+
                    DeviceOrientationEvent.requestPermission()
                        .then(permissionState => {
                            if (permissionState === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                                overlay.style.display = 'none';
                                loop();
                            } else {
                                alert("Permiso denegado. Se requieren los sensores.");
                            }
                        })
                        .catch(console.error);
                } else {
                    // Android / Otros
                    window.addEventListener('deviceorientation', handleOrientation, true);
                    overlay.style.display = 'none';
                    loop();
                }
            });

            // Motor de animación (Game Loop)
            function loop() {
                requestAnimationFrame(loop);

                // Suavizado del movimiento
                smoothBeta += (targetBeta - smoothBeta) * 0.15;
                smoothGamma += (targetGamma - smoothGamma) * 0.15;

                // Lógica para detectar si está de lado o acostado
                let mode = 'flat';
                if (Math.abs(smoothBeta) > 45 && Math.abs(smoothGamma) < 45) {
                    mode = 'portrait';
                } else if (Math.abs(smoothGamma) >= 45) {
                    mode = 'landscape';
                }

                // Limpiar pantalla
                ctx.clearRect(0, 0, width, height);

                if (mode === 'flat') {
                    drawFlatMode(smoothBeta, smoothGamma);
                } else {
                    drawEdgeMode(mode, smoothBeta, smoothGamma);
                }
            }

            // DIBUJAR: Teléfono acostado sobre la mesa
            function drawFlatMode(pitch, roll) {
                let isLevel = Math.abs(pitch) <= 1.0 && Math.abs(roll) <= 1.0;

                // Fondo
                ctx.fillStyle = isLevel ? COLOR_LEVEL : COLOR_BG;
                ctx.fillRect(0, 0, width, height);

                // Guías (Cruz central)
                ctx.strokeStyle = isLevel ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(cx, 0); ctx.lineTo(cx, height);
                ctx.moveTo(0, cy); ctx.lineTo(width, cy);
                ctx.stroke();

                // Círculo objetivo
                const radius = 80;
                ctx.strokeStyle = isLevel ? 'rgba(0,0,0,0.8)' : 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.stroke();

                // Burbuja / Líquido central
                let maxDist = Math.min(cx, cy) - radius;
                let scale = maxDist / 30; 
                let dx = roll * scale;
                let dy = pitch * scale;

                ctx.fillStyle = isLevel ? 'rgba(0,0,0,0.8)' : COLOR_LIQUID;
                ctx.beginPath();
                ctx.arc(cx + dx, cy + dy, radius, 0, Math.PI * 2);
                ctx.fill();

                // Textos de grados
                ctx.fillStyle = isLevel ? '#000000' : '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                let pStr = Math.abs(pitch) < 0.1 ? '0.0' : pitch.toFixed(1);
                let rStr = Math.abs(roll) < 0.1 ? '0.0' : roll.toFixed(1);

                ctx.font = '24px sans-serif';
                ctx.fillText(`^`, cx, cy - 180);
                ctx.font = '300 48px sans-serif';
                ctx.fillText(`${pStr}°`, cx, cy - 130);
                ctx.font = '24px sans-serif';
                ctx.fillText(`v`, cx, cy - 90);

                ctx.font = '300 48px sans-serif';
                ctx.fillText(`< ${rStr}° >`, cx, cy + 130);
            }

            // DIBUJAR: Teléfono levantado de lado (Vertical/Horizontal)
            function drawEdgeMode(mode, pitch, roll) {
                let angle = (mode === 'portrait') ? roll : pitch;
                let isLevel = Math.abs(angle) <= 1.0;

                ctx.fillStyle = isLevel ? COLOR_LEVEL : COLOR_BG;
                ctx.fillRect(0, 0, width, height);

                if (!isLevel) {
                    ctx.save();
                    ctx.translate(cx, cy);
                    // Rotar la pantalla para crear el horizonte
                    ctx.rotate(-angle * Math.PI / 180);
                    
                    // Líquido azul abajo
                    ctx.fillStyle = COLOR_LIQUID;
                    ctx.fillRect(-maxDim, 0, maxDim * 2, maxDim * 2);
                    
                    // Línea negra del horizonte
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(-maxDim, 0);
                    ctx.lineTo(maxDim, 0);
                    ctx.stroke();

                    ctx.restore();
                }

                // Marcas en los bordes
                ctx.strokeStyle = isLevel ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(cx, 0); ctx.lineTo(cx, 40); 
                ctx.moveTo(cx, height); ctx.lineTo(cx, height - 40);
                ctx.moveTo(0, cy); ctx.lineTo(40, cy); 
                ctx.moveTo(width, cy); ctx.lineTo(width - 40, cy); 
                ctx.stroke();

                // Texto Central de grados
                ctx.fillStyle = isLevel ? '#000000' : '#38bdf8'; 
                ctx.font = '300 80px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                let angleStr = Math.abs(angle) < 0.1 ? '0.0' : angle.toFixed(1);
                
                if (!isLevel) {
                    ctx.shadowColor = "rgba(0,0,0,0.9)";
                    ctx.shadowBlur = 15;
                }
                ctx.fillText(`${angleStr}°`, cx, cy - 100);
                ctx.shadowBlur = 0; 
            }
        };
    </script>
</body>
</html>
