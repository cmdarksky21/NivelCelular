<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nivel Pro - 3D</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #0f172a; font-family: sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #startBtn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 24px; font-weight: bold; background-color: #eab308; 
            color: #000; border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 10;
        }
    </style>
</head>
<body>

    <button id="startBtn">INICIAR NIVEL</button>
    <canvas id="levelCanvas"></canvas>

    <script>
        const canvas = document.getElementById('levelCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');

        let width, height;
        // Agregamos el eje Z para detectar cuando el teléfono está acostado
        let smoothGx = 0, smoothGy = 9.8, smoothGz = 0; 
        const filter = 0.15;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        startBtn.addEventListener('click', async () => {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        startBtn.style.display = 'none';
                        window.addEventListener('devicemotion', handleMotion);
                    } else {
                        alert("Permiso denegado. Se requieren los sensores.");
                    }
                } catch (error) {
                    console.error(error);
                }
            } else {
                startBtn.style.display = 'none';
                window.addEventListener('devicemotion', handleMotion);
            }
        });

        function handleMotion(event) {
            let gx = event.accelerationIncludingGravity.x || 0;
            let gy = event.accelerationIncludingGravity.y || 0;
            let gz = event.accelerationIncludingGravity.z || 0;

            let orientation = screen.orientation ? screen.orientation.angle : window.orientation || 0;
            
            // Corrección de giros de pantalla
            let tempGx = gx, tempGy = gy;
            if (orientation === 90) { gx = -tempGy; gy = tempGx; }
            else if (orientation === -90 || orientation === 270) { gx = tempGy; gy = -tempGx; }
            else if (orientation === 180) { gx = -tempGx; gy = -tempGy; }

            smoothGx = gx * filter + smoothGx * (1 - filter);
            smoothGy = gy * filter + smoothGy * (1 - filter);
            smoothGz = gz * filter + smoothGz * (1 - filter);
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Si la gravedad principal recae en el eje Z (más de 6 m/s²), el celular está acostado
            let isFlatMode = Math.abs(smoothGz) > 6.0;

            if (isFlatMode) {
                // ==========================================
                // MODO PLANO (Burbuja Circular 2D)
                // ==========================================
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, width, height);

                // Dibujar retícula central (cruz)
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(width/2, 0); ctx.lineTo(width/2, height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, height/2); ctx.lineTo(width, height/2); ctx.stroke();

                // Dibujar círculos objetivo
                ctx.strokeStyle = '#475569';
                ctx.beginPath(); ctx.arc(width/2, height/2, 30, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(width/2, height/2, 100, 0, Math.PI*2); ctx.stroke();

                // Calcular posición de la burbuja
                let bubbleRadius = 25;
                let multiplier = 20; 
                let bX = smoothGx * multiplier;
                let bY = -smoothGy * multiplier; 

                // Calcular ángulo general de inclinación plana
                let flatTiltRad = Math.atan2(Math.sqrt(smoothGx*smoothGx + smoothGy*smoothGy), Math.abs(smoothGz));
                let flatDegrees = flatTiltRad * (180 / Math.PI);
                let finalNumber = flatDegrees.toFixed(1);
                if (finalNumber === "-0.0" || finalNumber === "0.0") finalNumber = "0.0";
                
                let textColor = (finalNumber === "0.0") ? '#22c55e' : '#ef4444';

                // Dibujar la burbuja
                ctx.fillStyle = '#0ea5e9';
                ctx.beginPath(); 
                ctx.arc(width/2 + bX, height/2 + bY, bubbleRadius, 0, Math.PI*2); 
                ctx.fill();

                // Texto de medición plana
                ctx.fillStyle = textColor;
                ctx.font = 'bold 60px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(finalNumber + '°', width/2, height/2 - 180);

            } else {
                // ==========================================
                // MODO VERTICAL (Líquido y Bordes)
                // ==========================================
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, width, height);

                let rawAngleRad = Math.atan2(smoothGx, -smoothGy);
                
                ctx.save();
                ctx.translate(width / 2, height / 2);
                
                // CORRECCIÓN INVERTIDA: Se agregó el signo negativo para girar contra la inclinación real
                ctx.rotate(-rawAngleRad); 
                
                ctx.fillStyle = '#0ea5e9'; 
                ctx.fillRect(-width * 2, 0, width * 4, height * 4);
                
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-width * 2, 0);
                ctx.lineTo(width * 2, 0);
                ctx.stroke();
                ctx.restore();

                let rawDegrees = rawAngleRad * (180 / Math.PI);
                let displayAngle = -rawDegrees; 
                let modAngle = displayAngle % 90;
                
                if (modAngle > 45) {
                    modAngle -= 90;
                } else if (modAngle < -45) {
                    modAngle += 90;
                }

                let finalNumber = modAngle.toFixed(1);
                if (finalNumber === "-0.0" || finalNumber === "0.0") {
                    finalNumber = "0.0";
                }

                let textColor = (finalNumber === "0.0") ? '#22c55e' : '#ef4444';

                ctx.fillStyle = textColor;
                ctx.font = 'bold 80px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(finalNumber + '°', width / 2, height / 3);
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
