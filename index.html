<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nivel de Burbuja Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* Prevent scrolling and bounce on mobile */
            overflow: hidden;
            touch-action: none;
            background-color: #0f172a; /* Tailwind slate-900 */
        }
        
        .bubble {
            /* Smooth liquid-like movement */
            transition: transform 0.05s ease-out;
            /* Glowing orb effect */
            background: radial-gradient(circle at 30% 30%, #a7f3d0, #22c55e);
            box-shadow: 0 0 15px 2px rgba(34, 197, 94, 0.6), inset 0 0 10px rgba(255,255,255,0.5);
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.2) 100%);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="text-slate-200 font-sans h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- Header / Branding -->
    <div class="absolute top-8 w-full text-center">
        <h1 class="text-2xl font-bold tracking-wider text-slate-100 uppercase">Nivel Digital</h1>
        <p class="text-slate-400 text-sm mt-1">Coloca el dispositivo en una superficie plana</p>
    </div>

    <!-- Main Level Container -->
    <div class="relative flex items-center justify-center">
        <!-- Outer Ring -->
        <div id="level-container" class="glass-panel w-72 h-72 rounded-full border-8 border-slate-700 relative flex items-center justify-center overflow-hidden">
            
            <!-- Concentric Target Rings -->
            <div class="absolute w-48 h-48 rounded-full border border-slate-600/50"></div>
            <div class="absolute w-24 h-24 rounded-full border-2 border-emerald-500/30 bg-emerald-500/10"></div>
            <div class="absolute w-2 h-2 rounded-full bg-emerald-500/80 z-10"></div> <!-- Absolute center dot -->

            <!-- Crosshairs -->
            <div class="absolute w-full h-px bg-slate-600/40"></div>
            <div class="absolute h-full w-px bg-slate-600/40"></div>

            <!-- The Bubble -->
            <!-- We use absolute positioning and will manipulate the transform via JS -->
            <div id="bubble" class="bubble absolute w-12 h-12 rounded-full z-20" style="transform: translate(0px, 0px);"></div>
        </div>
    </div>

    <!-- Angle Data Display -->
    <div class="absolute bottom-16 flex gap-6 text-center">
        <div class="bg-slate-800 px-6 py-3 rounded-2xl border border-slate-700 min-w-[120px]">
            <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Eje X (Gamma)</div>
            <div id="val-x" class="text-2xl font-mono text-emerald-400 font-bold">0.0&deg;</div>
        </div>
        <div class="bg-slate-800 px-6 py-3 rounded-2xl border border-slate-700 min-w-[120px]">
            <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Eje Y (Beta)</div>
            <div id="val-y" class="text-2xl font-mono text-emerald-400 font-bold">0.0&deg;</div>
        </div>
    </div>

    <!-- Permission & Initialization Overlay -->
    <!-- Required for iOS 13+ to request sensor access -->
    <div id="permission-overlay" class="absolute inset-0 bg-slate-900/95 z-50 flex flex-col items-center justify-center px-6 text-center backdrop-blur-sm">
        <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 max-w-sm w-full shadow-2xl">
            <svg class="w-16 h-16 text-emerald-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
            </svg>
            <h2 class="text-2xl font-bold text-white mb-2">Activación de Sensores</h2>
            <p class="text-slate-400 text-sm mb-6">Para utilizar el nivel, necesitamos acceso a los sensores de movimiento (giroscopio/acelerómetro) de tu dispositivo.</p>
            <button id="start-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-6 rounded-xl transition duration-200 transform hover:scale-105 active:scale-95 shadow-lg shadow-emerald-500/30">
                Otorgar Permiso / Iniciar
            </button>
        </div>
    </div>

    <script>
        const bubble = document.getElementById('bubble');
        const valX = document.getElementById('val-x');
        const valY = document.getElementById('val-y');
        const overlay = document.getElementById('permission-overlay');
        const startBtn = document.getElementById('start-btn');
        const levelContainer = document.getElementById('level-container');

        // Mathematical limits
        const maxTilt = 45; // Degrees of tilt that represent hitting the edge of the level
        
        // Container radius minus bubble radius to find max movement
        // Container is w-72 (288px) -> r=144. Bubble is w-12 (48px) -> r=24.
        // Max distance = 144 - 24 - 8(border) = 112px
        const maxDistance = 112; 
        const multiplier = maxDistance / maxTilt;

        function handleOrientation(event) {
            // beta: front-to-back tilt in degrees, where front is positive (-180 to 180)
            // gamma: left-to-right tilt in degrees, where right is positive (-90 to 90)
            let beta = event.beta;
            let gamma = event.gamma;

            // Handle edge cases where device is flipped or unsupported
            if (beta === null || gamma === null) return;

            // For a flat surface level, we focus on -90 to 90 range.
            // Normalize values just in case
            if (beta > 90) beta = 90;
            if (beta < -90) beta = -90;

            // Display raw degrees
            valX.innerHTML = `${gamma.toFixed(1)}&deg;`;
            valY.innerHTML = `${beta.toFixed(1)}&deg;`;

            // Visual feedback: color text green if perfectly level (< 1 degree)
            if (Math.abs(gamma) < 1.0) valX.classList.replace('text-slate-200', 'text-emerald-400');
            else valX.classList.replace('text-emerald-400', 'text-slate-200');

            if (Math.abs(beta) < 1.0) valY.classList.replace('text-slate-200', 'text-emerald-400');
            else valY.classList.replace('text-emerald-400', 'text-slate-200');

            // Calculate pixel movement
            let xPos = gamma * multiplier;
            let yPos = beta * multiplier;

            // Clamp movement to the circular boundary using Pythagorean theorem
            let distance = Math.sqrt(xPos * xPos + yPos * yPos);
            
            if (distance > maxDistance) {
                // Scale x and y back to the maximum radius boundary
                const ratio = maxDistance / distance;
                xPos *= ratio;
                yPos *= ratio;
            }

            // Apply transform (Note: Y is inverted in device coordinates usually, but beta positive 
            // means bottom of phone is lifting, so bubble goes up (negative Y in CSS)). 
            // Depending on physical preference, you might need to negate xPos or yPos. 
            // Typically if you tilt phone left (gamma negative), bubble goes right (positive X).
            // So we negate them for realistic fluid dynamics.
            bubble.style.transform = `translate(${-xPos}px, ${-yPos}px)`;
        }

        // Initialize and request permissions
        function initSensors() {
            // iOS 13+ requires explicit permission via a user gesture
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            overlay.style.display = 'none';
                        } else {
                            alert("Permiso denegado. La aplicación no puede funcionar sin acceso a los sensores.");
                        }
                    })
                    .catch(console.error);
            } else {
                // Non-iOS 13+ devices (Android, older iOS, PC)
                window.addEventListener('deviceorientation', handleOrientation, true);
                overlay.style.display = 'none';
                
                // Warn if run on desktop (where sensors might be null after starting)
                setTimeout(() => {
                    if (valX.innerText === "0.0°" && valY.innerText === "0.0°") {
                        console.log("No data received. Ensure you are on a mobile device with hardware sensors.");
                    }
                }, 2000);
            }
        }

        // Bind button click
        startBtn.addEventListener('click', initSensors);

    </script>
</body>
</html>
