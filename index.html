<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nivel Celular Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
            background-color: #0f172a; /* Fondo oscuro */
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        @keyframes pulse-btn {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(250, 204, 21, 0.6); }
            50% { transform: scale(1.03); box-shadow: 0 0 60px rgba(250, 204, 21, 0.9); }
        }
        .btn-massive {
            animation: pulse-btn 1.5s infinite;
        }
    </style>
</head>
<body>

    <!-- OVERLAY DE INICIO (Botón Amarillo Masivo para Permisos) -->
    <div id="overlay" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-black px-4">
        <div class="text-center w-full h-full flex flex-col justify-center max-w-lg mx-auto">
            <h1 class="text-5xl font-black text-white mb-6 uppercase tracking-wider">Nivel Pro</h1>
            <p class="text-gray-300 text-xl mb-12 font-medium px-4">Haz clic en el botón para activar los sensores de gravedad y comenzar a nivelar.</p>
            
            <button id="startBtn" class="btn-massive w-full bg-yellow-400 hover:bg-yellow-300 text-black font-black text-5xl py-12 rounded-[2.5rem] transition-colors uppercase tracking-widest border-8 border-yellow-200 shadow-2xl">
                INICIAR<br>NIVEL
            </button>
        </div>
    </div>

    <!-- LIENZO DEL NIVEL -->
    <canvas id="canvas"></canvas>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const overlay = document.getElementById('overlay');
            const startBtn = document.getElementById('startBtn');

            let width, height, cx, cy, maxDim;

            // Variables de gravedad (aceleración pura)
            let rawX = 0, rawY = 0, rawZ = 9.8; 
            let smoothX = 0, smoothY = 0, smoothZ = 9.8;

            // Filtro de paso bajo (Low-Pass Filter). Valores más pequeños = más suavizado.
            const LPF_ALPHA = 0.15; 

            // Colores temáticos
            const COLOR_BG = '#0f172a'; // Slate 900
            const COLOR_LIQUID = '#0ea5e9'; // Bright Blue (Sky 500)
            const COLOR_TEXT_GOOD = '#22c55e'; // Green 500
            const COLOR_TEXT_BAD = '#ef4444'; // Red 500

            // Ajustar el Canvas al tamaño de la pantalla
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * window.devicePixelRatio;
                canvas.height = height * window.devicePixelRatio;
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                cx = width / 2;
                cy = height / 2;
                maxDim = Math.max(width, height) * 1.5; // Suficiente para rotar sin esquinas cortadas
            }
            window.addEventListener('resize', resize);
            resize();

            // LECTOR DE GRAVEDAD DIRECTO (Evita Gimbal Lock)
            function handleMotion(event) {
                let acc = event.accelerationIncludingGravity;
                if (!acc) return;
                
                // Mapear los ejes. Diferentes SO pueden invertir la Y, 
                // pero por lo general, con el teléfono vertical X es izq/der, Y es arriba/abajo, Z es profundidad.
                rawX = acc.x || 0;
                rawY = acc.y || 0;
                rawZ = acc.z || 0;
            }

            function startSensor() {
                window.addEventListener('devicemotion', handleMotion, true);
                overlay.style.display = 'none';
                requestAnimationFrame(loop);
            }

            // Iniciar aplicación (Solicita permisos DeviceMotion en iOS)
            startBtn.addEventListener('click', () => {
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    DeviceMotionEvent.requestPermission()
                        .then(permissionState => {
                            if (permissionState === 'granted') {
                                startSensor();
                            } else {
                                alert("Permiso de sensores de movimiento denegado.");
                            }
                        })
                        .catch(console.error);
                } else {
                    startSensor();
                }
            });

            // Bucle principal de renderizado
            function loop() {
                // Aplicar Filtro de Paso Bajo (Low-Pass Filter) para suavizar temblores
                smoothX += (rawX - smoothX) * LPF_ALPHA;
                smoothY += (rawY - smoothY) * LPF_ALPHA;
                smoothZ += (rawZ - smoothZ) * LPF_ALPHA;

                ctx.clearRect(0, 0, width, height);

                // Determinar el modo: Si la fuerza G en Z es fuerte (> 8 m/s^2), el teléfono está apoyado en una mesa
                let isFlat = Math.abs(smoothZ) > 8.0;

                if (isFlat) {
                    drawFlatMode();
                } else {
                    drawEdgeMode();
                }

                requestAnimationFrame(loop);
            }

            // MODO BURBUJA (Acostado)
            function drawFlatMode() {
                // La perfección se mide en cuán cerca están X e Y de 0.
                let tiltX = smoothX;
                let tiltY = -smoothY; // Invertimos Y para que la burbuja se mueva lógicamente

                let exactnessThreshold = 0.3; // Tolerancia en m/s^2
                let isLevel = Math.abs(tiltX) < exactnessThreshold && Math.abs(tiltY) < exactnessThreshold;

                // Fondo negro
                ctx.fillStyle = COLOR_BG;
                ctx.fillRect(0, 0, width, height);

                // Cruz central
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(cx, 0); ctx.lineTo(cx, height);
                ctx.moveTo(0, cy); ctx.lineTo(width, cy);
                ctx.stroke();

                // Círculos objetivo
                const targetRadius = 60;
                ctx.strokeStyle = isLevel ? COLOR_TEXT_GOOD : 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(cx, cy, targetRadius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy, targetRadius * 2.5, 0, Math.PI * 2);
                ctx.stroke();

                // Burbuja Líquida
                let maxMove = Math.min(cx, cy) - targetRadius;
                // Multiplicador de sensibilidad (gravedad máx esperada en ejes paralelos es ~2 cuando está plano)
                let sensitivity = maxMove / 2.5; 
                
                let dx = tiltX * sensitivity;
                let dy = tiltY * sensitivity;

                ctx.fillStyle = COLOR_LIQUID;
                ctx.beginPath();
                ctx.arc(cx + dx, cy + dy, targetRadius * 0.8, 0, Math.PI * 2);
                ctx.fill();

                // Texto Central 
                ctx.fillStyle = isLevel ? COLOR_TEXT_GOOD : COLOR_TEXT_BAD;
                ctx.font = '300 48px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Mostrar ángulo en grados como referencia
                let pitch = Math.atan2(smoothY, Math.abs(smoothZ)) * 180 / Math.PI;
                let roll = Math.atan2(smoothX, Math.abs(smoothZ)) * 180 / Math.PI;
                let combinedErr = Math.sqrt(pitch*pitch + roll*roll);
                
                let displayAngle = combinedErr.toFixed(1);
                if (combinedErr < 0.1) displayAngle = "0.0";
                
                ctx.fillText(`${displayAngle}°`, cx, cy - targetRadius - 40);
                
                // Mostrar exactitud
                ctx.font = '700 24px sans-serif';
                ctx.fillText(isLevel ? "NIVELADO" : "DESNIVELADO", cx, cy + targetRadius + 50);
            }

            // MODO LÍQUIDO (De pie / De lado)
            function drawEdgeMode() {
                // Cálculo de horizonte perfecto usando Atan2 de los ejes Y y X (Vectores 2D de gravedad).
                // Al ser vectores continuos, elimina completamente el problema de Gimbal Lock (saltos a 90/180).
                let angleRad = Math.atan2(smoothX, smoothY); 
                let angleDeg = angleRad * (180 / Math.PI);

                // Calcular la desviación con respecto al ángulo de 90 grados más cercano
                let nearestSnap = Math.round(angleDeg / 90) * 90;
                let deviation = angleDeg - nearestSnap;
                
                // Está nivelado si el margen de error es menor a 0.5 grados
                let isLevel = Math.abs(deviation) < 0.5;

                // Fondo oscuro
                ctx.fillStyle = COLOR_BG;
                ctx.fillRect(0, 0, width, height);

                ctx.save();
                ctx.translate(cx, cy);
                
                // Rotar el canvas basándose en la dirección pura de la gravedad
                ctx.rotate(angleRad);
                
                // Dibujar Líquido Azul gigante
                ctx.fillStyle = COLOR_LIQUID;
                ctx.fillRect(-maxDim, 0, maxDim * 2, maxDim * 2);
                
                // Dibujar Línea del horizonte (borde del líquido)
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-maxDim, 0);
                ctx.lineTo(maxDim, 0);
                ctx.stroke();

                ctx.restore();

                // Ticks marcadores estáticos en la pantalla
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cx - 30, cy); ctx.lineTo(cx + 30, cy); // Centro
                ctx.moveTo(0, cy); ctx.lineTo(40, cy); // Borde izq
                ctx.moveTo(width, cy); ctx.lineTo(width - 40, cy); // Borde der
                ctx.moveTo(cx, 0); ctx.lineTo(cx, 40); // Borde sup
                ctx.moveTo(cx, height); ctx.lineTo(cx, height - 40); // Borde inf
                ctx.stroke();

                // Formatear texto (Evitar -0.0)
                let displayAngle = deviation.toFixed(1);
                if (Math.abs(deviation) < 0.1) displayAngle = "0.0";

                // Renderizar Texto Flotante (Verde si exacto, Rojo si inexacto)
                ctx.fillStyle = isLevel ? COLOR_TEXT_GOOD : COLOR_TEXT_BAD; 
                ctx.font = '300 96px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.shadowColor = "rgba(0,0,0,0.8)";
                ctx.shadowBlur = 15;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 4;
                
                ctx.fillText(`${displayAngle}°`, cx, cy - 120);
                ctx.shadowBlur = 0; 
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
            }
        };
    </script>
</body>
</html>
