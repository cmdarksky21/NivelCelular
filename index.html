<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nivel Pro</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #0f172a; font-family: sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #startBtn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 24px; font-weight: bold; background-color: #eab308; 
            color: #000; border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 10;
        }
    </style>
</head>
<body>

    <button id="startBtn">INICIAR NIVEL</button>
    <canvas id="levelCanvas"></canvas>

    <script>
        const canvas = document.getElementById('levelCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');

        let width, height;
        let smoothGx = 0, smoothGy = 9.8; 
        const filter = 0.15; // Filtro de paso bajo para suavizar el movimiento

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        startBtn.addEventListener('click', async () => {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        startBtn.style.display = 'none';
                        window.addEventListener('devicemotion', handleMotion);
                    } else {
                        alert("Permiso denegado. Se requieren los sensores.");
                    }
                } catch (error) {
                    console.error(error);
                }
            } else {
                startBtn.style.display = 'none';
                window.addEventListener('devicemotion', handleMotion);
            }
        });

        function handleMotion(event) {
            let gx = event.accelerationIncludingGravity.x || 0;
            let gy = event.accelerationIncludingGravity.y || 0;

            // Ajuste automático por si la pantalla gira (landscape/portrait)
            let orientation = screen.orientation ? screen.orientation.angle : window.orientation || 0;
            if (orientation === 90) { let temp = gx; gx = -gy; gy = temp; }
            else if (orientation === -90 || orientation === 270) { let temp = gx; gx = gy; gy = -temp; }
            else if (orientation === 180) { gx = -gx; gy = -gy; }

            // Suavizado del sensor
            smoothGx = gx * filter + smoothGx * (1 - filter);
            smoothGy = gy * filter + smoothGy * (1 - filter);
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Fondo oscuro (donde van los números)
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, width, height);

            // Calcular el ángulo matemático directo
            // atan2(x, y) con Y invertido para que el teléfono vertical sea 0 grados.
            let rawAngleRad = Math.atan2(smoothGx, -smoothGy);
            
            // Dibujar el líquido (claro)
            ctx.save();
            ctx.translate(width / 2, height / 2);
            ctx.rotate(rawAngleRad); 
            ctx.fillStyle = '#0ea5e9'; // Azul claro
            // Dibuja un rectángulo gigante que cubre la mitad inferior
            ctx.fillRect(-width * 2, 0, width * 4, height * 4);
            
            // Línea separadora blanca
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-width * 2, 0);
            ctx.lineTo(width * 2, 0);
            ctx.stroke();
            ctx.restore();

            // Lógica del número en pantalla (Comportamiento de nivel de construcción)
            let rawDegrees = rawAngleRad * (180 / Math.PI);
            
            // Invertir para que la derecha sea negativa y la izquierda positiva
            let displayAngle = -rawDegrees; 

            // Reducir el ángulo al rango de -45 a 45 grados
            let modAngle = displayAngle % 90;
            if (modAngle > 45) {
                modAngle -= 90;
            } else if (modAngle < -45) {
                modAngle += 90;
            }

            // Redondear a un decimal
            let finalNumber = modAngle.toFixed(1);
            
            // Si es exactamente 0.0, o -0.0, forzarlo a 0.0 positivo
            if (finalNumber === "-0.0" || finalNumber === "0.0") {
                finalNumber = "0.0";
            }

            // Cambiar a verde si está perfectamente nivelado, si no, mantener rojo
            let textColor = (finalNumber === "0.0") ? '#22c55e' : '#ef4444';

            // Dibujar el texto
            ctx.fillStyle = textColor;
            ctx.font = 'bold 80px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Centrar el texto en la mitad superior de la pantalla
            ctx.fillText(finalNumber + '°', width / 2, height / 3);

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
